openapi: 3.1.0
info:
  title: API kiểm tra khối lượng hiện trường
  version: 0.6.0
  description: Hợp đồng API đã triển khai đến hết Mốc 5, gồm đối chiếu, snapshot và Excel/GeoJSON.
  license:
    name: Proprietary — sử dụng nội bộ/cá nhân
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      security: []
      tags: [identity]
      summary: Đăng nhập và tạo cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Phiên đăng nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/session:
    get:
      tags: [identity]
      summary: Lấy người dùng và hạn phiên hiện tại
      responses:
        '200':
          description: Phiên hiện tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [identity]
      summary: Thu hồi phiên hiện tại
      responses:
        '200': { description: Đã đăng xuất }
        default: { $ref: '#/components/responses/Error' }
  /admin-areas:
    get:
      tags: [admin-areas]
      summary: Liệt kê địa bàn còn hiệu lực
      responses:
        '200':
          description: Danh sách địa bàn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminArea' }
        default: { $ref: '#/components/responses/Error' }
  /catalog/service-groups:
    get:
      tags: [catalog]
      summary: Liệt kê nhóm dịch vụ
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Danh sách nhóm
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceGroup' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [catalog]
      summary: Tạo nhóm dịch vụ; yêu cầu owner hoặc catalog_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceGroup' }
      responses:
        '201':
          description: Nhóm vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceGroup' }
        default: { $ref: '#/components/responses/Error' }
  /catalog/service-groups/{id}:
    patch:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [catalog]
      summary: Sửa hoặc ngừng dùng nhóm dịch vụ
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                displayOrder: { type: integer, minimum: 0 }
                color: { type: [string, 'null'] }
                active: { type: boolean }
      responses:
        '200':
          description: Nhóm đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceGroup' }
        default: { $ref: '#/components/responses/Error' }
  /catalog/work-types:
    get:
      tags: [catalog]
      summary: Liệt kê loại công tác và phiên bản công thức
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Danh sách loại công tác
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkType' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [catalog]
      summary: Tạo phiên bản loại công tác
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkType' }
      responses:
        '201':
          description: Loại công tác vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkType' }
        default: { $ref: '#/components/responses/Error' }
  /catalog/work-types/{id}:
    patch:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [catalog]
      summary: Đổi tên hoặc ngừng dùng loại công tác
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: Loại công tác đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkType' }
        default: { $ref: '#/components/responses/Error' }
  /cases:
    get:
      tags: [cases]
      summary: Liệt kê hồ sơ thuộc người dùng hiện tại
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CaseStatus' }
      responses:
        '200':
          description: Danh sách hồ sơ
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InspectionCase' }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Tạo hồ sơ và snapshot ranh giới địa bàn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCase' }
      responses:
        '201':
          description: Hồ sơ vừa tạo
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [cases]
      summary: Lấy hồ sơ
      responses:
        '200':
          description: Hồ sơ
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Sửa hồ sơ bằng optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                inspectedEntity: { type: [string, 'null'] }
                description: { type: [string, 'null'] }
                status: { enum: [draft, in_progress, review, archived] }
      responses:
        '200':
          description: Hồ sơ đã sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectionCase' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Xóa mềm hồ sơ
      responses:
        '204': { description: Đã xóa mềm }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/work-items:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [cases]
      summary: Liệt kê công tác trong hồ sơ
      responses:
        '200':
          description: Danh sách công tác
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Thêm công tác và snapshot công thức
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workTypeId, name]
              additionalProperties: false
              properties:
                workTypeId: { type: string, format: uuid }
                name: { type: string, minLength: 1, maxLength: 300 }
                periodStart: { type: [string, 'null'], format: date }
                periodEnd: { type: [string, 'null'], format: date }
                warningThreshold: { type: object }
      responses:
        '201':
          description: Công tác vừa thêm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/map-context:
    get:
      tags: [cases, measurements]
      summary: Lấy ranh giới snapshot làm ngữ cảnh bản đồ của hồ sơ
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Ranh giới hồ sơ ở EPSG:4326
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseMapContext' }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/measurements:
    parameters:
      - $ref: '#/components/parameters/WorkItemId'
    get:
      tags: [measurements]
      summary: Liệt kê phép đo và tổng các phiên bản hiện hành đã xác nhận
      responses:
        '200':
          description: Danh sách phép đo và tổng chính thức
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementListResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [measurements]
      summary: Lưu hình học gốc, kiểm tra và tính chính thức bằng PostGIS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMeasurement' }
      responses:
        '201':
          description: Phép đo vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        default: { $ref: '#/components/responses/Error' }
  /measurements/{measurementId}:
    parameters:
      - $ref: '#/components/parameters/MeasurementId'
    get:
      tags: [measurements]
      summary: Lấy một phép đo thuộc hồ sơ của người dùng hiện tại
      responses:
        '200':
          description: Phép đo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [measurements]
      summary: Xóa mềm phép đo và ghi audit
      responses:
        '204': { description: Đã xóa mềm }
        default: { $ref: '#/components/responses/Error' }
  /measurements/{measurementId}/validate:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [measurements]
      summary: Kiểm tra lại hình học và tính lại kết quả chính thức
      parameters:
        - $ref: '#/components/parameters/MeasurementId'
      responses:
        '200':
          description: Phép đo sau kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        default: { $ref: '#/components/responses/Error' }
  /measurements/{measurementId}/confirm:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [measurements]
      summary: Xác nhận phép đo không còn lỗi nghiêm trọng
      parameters:
        - $ref: '#/components/parameters/MeasurementId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMeasurement' }
      responses:
        '200':
          description: Phép đo đã xác nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        default: { $ref: '#/components/responses/Error' }
  /measurements/{measurementId}/supersede:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [measurements]
      summary: Hiệu chỉnh phép đo đã xác nhận bằng một phiên bản mới
      parameters:
        - $ref: '#/components/parameters/MeasurementId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupersedeMeasurement' }
      responses:
        '201':
          description: Phiên bản phép đo mới, chưa xác nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Measurement' }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/audit-events:
    get:
      tags: [audit]
      summary: Đọc tối đa 200 sự kiện audit gần nhất của hồ sơ
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Nhật ký append-only
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        default: { $ref: '#/components/responses/Error' }
  /treatment-facilities:
    get:
      tags: [routing]
      summary: Liệt kê điểm tập kết, trạm trung chuyển và cơ sở xử lý
      responses:
        '200': { description: Danh mục cơ sở }
        default: { $ref: '#/components/responses/Error' }
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [routing]
      summary: Tạo cơ sở định tuyến
      responses:
        '201': { description: Cơ sở vừa tạo }
        default: { $ref: '#/components/responses/Error' }
  /routes/calculate:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [routing]
      summary: Xem trước các phương án qua RoutingProvider
      responses:
        '200': { description: Phương án, provider, thời điểm và fingerprint }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/routes:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [routing]
      summary: Backend tính lại và lưu route chính thức
      responses:
        '201': { description: Route và measurement đã xác nhận }
        default: { $ref: '#/components/responses/Error' }
  /routes/{routeId}/recalculate:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [routing]
      summary: Tạo phiên bản route mới, không ghi đè bản cũ
      responses:
        '201': { description: Phiên bản route mới }
        default: { $ref: '#/components/responses/Error' }
  /routes/weighted-distance:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [routing]
      summary: Tính cự ly bình quân gia quyền
      responses:
        '200': { description: Cự ly gia quyền hoặc cảnh báo thiếu trọng lượng }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/gps-tracks:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [field]
      summary: Lưu GPS raw/normalized bằng mutation idempotent
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Device-Id, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: GPS track mới }
        '200': { description: Kết quả cũ của cùng mutation }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/gps-points:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [field]
      summary: Ghi vị trí GPS hiện tại kèm accuracy bằng mutation idempotent
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Device-Id, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: GPS point mới }
        '200': { description: Kết quả cũ của cùng mutation }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/attachments:
    get:
      tags: [field]
      summary: Liệt kê ảnh đã xác minh của công tác để liên kết nguồn hoặc giải trình
      responses:
        '200': { description: Danh sách attachment completed thuộc công tác }
        default: { $ref: '#/components/responses/Error' }
  /attachments/presign:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [field]
      summary: Tạo upload ảnh pending và URL MinIO có thời hạn
      responses:
        '201': { description: Upload pending }
        default: { $ref: '#/components/responses/Error' }
  /attachments/complete:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [field]
      summary: Xác minh object và hoàn tất bằng chứng ảnh
      responses:
        '200': { description: Ảnh đã xác minh SHA-256 }
        default: { $ref: '#/components/responses/Error' }
  /work-items/{workItemId}/source-quantities:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [comparison]
      summary: Thêm khối lượng nguồn cho công tác chưa khóa
      responses:
        '201': { description: Khối lượng nguồn đã lưu }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/comparison:
    get:
      tags: [comparison]
      summary: Tổng hợp measurement confirmed và đối chiếu từng nguồn
      responses:
        '200': { description: Chi tiết và tổng hợp theo nhóm/hồ sơ }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/comparison-settings:
    patch:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [comparison]
      summary: Cấu hình ngưỡng tuyệt đối và tỷ lệ cấp hồ sơ
      responses:
        '200': { description: Ngưỡng đã lưu }
        default: { $ref: '#/components/responses/Error' }
  /source-quantities/{id}/explanation:
    put:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [comparison]
      summary: Lưu giải trình chênh lệch và attachment liên kết nếu có
      responses:
        '200': { description: Giải trình đã lưu }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/lock:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Tạo snapshot hash và khóa hồ sơ với lý do
      responses:
        '200': { description: Hồ sơ đã khóa và snapshot }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/unlock:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [cases]
      summary: Mở khóa hồ sơ với lý do, không xóa snapshot cũ
      responses:
        '200': { description: Hồ sơ đã mở khóa }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/exports/excel:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [exports]
      summary: Xuất hồ sơ đã khóa thành workbook XLSX năm sheet kèm snapshot và SHA-256
      responses:
        '200': { description: Tệp XLSX }
        default: { $ref: '#/components/responses/Error' }
  /cases/{caseId}/exports/geojson:
    post:
      security: [{ cookieAuth: [], csrfToken: [] }]
      tags: [exports]
      summary: Xuất hồ sơ đã khóa thành FeatureCollection GeoJSON giữ ID truy vết
      responses:
        '200': { description: Tệp GeoJSON }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dove_session
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IncludeInactive:
      name: includeInactive
      in: query
      schema: { type: boolean, default: false }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MeasurementId:
      name: measurementId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Lỗi chuẩn có mã và trace ID
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
        traceId: { type: string }
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { enum: [owner, editor, reviewer, viewer, catalog_admin] }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
    AdminArea:
      type: object
      required: [id, code, name, areaType, source, sourceHash, sourceVersion, validFrom, validTo]
      properties:
        id: { type: string, format: uuid }
