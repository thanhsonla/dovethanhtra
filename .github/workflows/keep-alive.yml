name: Render Backend Keep-Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Keep-Alive HTTP Request
        run: |
          curl --fail --show-error --silent \
            --max-time 75 \
            --retry 2 \
            --retry-delay 5 \
            --output /dev/null \
            --write-out "HTTP Status: %{http_code} | Total Time: %{time_total}s\n" \
            https://dovethanhtra-api-2g6e.onrender.com/api/v1/health/live
