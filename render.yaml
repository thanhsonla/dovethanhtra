services:
  - type: web
    name: dovethanhtra-api
    env: node
    region: singapore
    plan: free
    buildCommand: pnpm --filter @dove/contracts build && pnpm --filter @dove/api build
    startCommand: pnpm --filter @dove/api start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: COOKIE_SECURE
        value: 'true'
      - key: SESSION_TTL_HOURS
        value: '12'
      - key: LOGIN_REQUESTS_PER_MINUTE
        value: '5'
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_PORT
        value: '443'
      - key: MINIO_USE_SSL
        value: 'true'
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
